name: Build Mini Web APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.kt"
      - "**.kts"
      - "**.xml"
      - "**.properties"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK environment variable is missing."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate sdkmanager."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android project at repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Android project found at repository root."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK and run unit tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
