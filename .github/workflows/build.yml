name: Build Mini Web APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Mini-Web-Android-Studio.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use the Android SDK already installed on the GitHub-hosted runner.
      # Avoid setup-android here because its command-line-tools bootstrap
      # failed on the runner shown in the user's logs.
      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME and ANDROID_SDK_ROOT are not set."
            exit 1
          fi
          echo "Android SDK root: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extract Mini Web project
        run: |
          unzip -q Mini-Web-Android-Studio.zip
          test -f mini-web/app/build.gradle.kts

      - name: Build debug APK and run unit tests
        working-directory: mini-web
        run: gradle assembleDebug testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-debug-apk
          path: mini-web/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-test-reports
          path: mini-web/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
