name: Build Mini Web APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK environment variable is missing."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate sdkmanager."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          found=""
          while IFS= read -r -d '' archive; do
            echo "Checking archive: $archive"
            if unzip -Z1 "$archive" | grep -Eq '(^|/)app/build.gradle.kts$'; then
              found="$archive"
              break
            fi
          done < <(find . -maxdepth 4 -type f -iname '*.zip' -print0)

          if [ -z "$found" ]; then
            echo "No ZIP containing app/build.gradle.kts was found."
            echo "Files in repository:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Using archive: $found"
          unzip -q "$found" -d extracted
          BUILD_FILE="$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "Could not locate app/build.gradle.kts after extraction."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$BUILD_FILE")")"
          echo "MINI_WEB_PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$MINI_WEB_PROJECT_DIR"
          gradle assembleDebug testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-test-reports
          path: extracted/**/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
