name: Build Mini Web APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Mini-Web-Android-Studio.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extract Mini Web project
        run: |
          unzip -q Mini-Web-Android-Studio.zip
          test -f mini-web/app/build.gradle.kts

      - name: Build debug APK and run unit tests
        working-directory: mini-web
        run: gradle assembleDebug testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-debug-apk
          path: mini-web/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-web-test-reports
          path: mini-web/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
